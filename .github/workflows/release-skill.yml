# 发布技能包: Release 发布时把 skill/ 下的技能打成 zip 并挂到该 Release 的 assets
name: 打包技能并上传到Release assets
on:
  release:
    types: ["published"]
permissions:
  contents: write
concurrency:
  group: "release-skill"
  cancel-in-progress: false
env:
  # 统一经环境变量取 tag, 避免把 release 事件输入直接拼进 shell 造成命令注入
  TAG: ${{ github.event.release.tag_name }}
jobs:
  package:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
      - name: 打包 skill/ 下的技能
        id: package
        run: |
          set -euo pipefail
          # 压缩包名直接使用 Release 的 tag_name
          ZIP="SKILL-agents-md-best-practices-${TAG}.zip"
          # 打包 skill/ 的下一层内容
          # 可以整个目录拷进技能目录, 与 README 的安装说明一致.
          # 用 find 生成文件名并去掉前缀 ./, 避免压缩包里出现 ./
          cd skill
          # %P 会去掉起点前缀, 用 . 作起点以保留顶层技能目录(与 README 的安装说明一致)
          # 排除 __pycache__ pyc .DS_Store, 以及 skill/ 下的旧 zip 产物
          find . -mindepth 1 -type f \
            -not -path '*/__pycache__/*' -not -name '*.pyc' -not -name '.DS_Store' \
            -not -name '*.zip' \
            -printf '%P\n' | sort | zip -X -9 "../${ZIP}" -@
          cd ..
          # 打包自检: 压缩包非空, 且技能入口在里面
          test -s "${ZIP}"
          unzip -l "${ZIP}" | grep -q 'agents-md-best-practices/SKILL.md'
          echo "== ${ZIP} 内容 =="
          unzip -l "${ZIP}"
          echo "== SHA256 =="
          sha256sum "${ZIP}"
          {
            echo "### ${ZIP}"
            echo ""
            echo "打包自 `skill/` 目录"
            echo ""
            echo '```'
            unzip -l "${ZIP}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          # 把压缩包名透传给后续上传步骤
          echo "zip=${ZIP}" >> "${GITHUB_OUTPUT}"
      - name: 上传到 Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" \
            "${ZIP}" --clobber
